<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Année scolaire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f6f7f9;color:#161d2b;display:flex;justify-content:center;padding:20px 14px;min-height:100vh}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #eef0f4;border-radius:20px;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px}
.hero{text-align:center}
.hero .d{color:#7b8499;font-size:15px;text-transform:capitalize}
.hero .p{font-size:64px;font-weight:800;color:#5b5bd6;margin:6px 0;line-height:1}
.bar{height:12px;background:#eef0f4;border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:#5b5bd6;border-radius:99px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid #eef0f4;border-radius:16px;padding:16px;text-align:center}
.tile b{font-size:28px;display:block}
.tile span{font-size:13px;color:#7b8499}
select,input{width:100%;padding:11px;border:1px solid #eef0f4;border-radius:12px;font-size:15px;margin-top:6px}
button{background:#5b5bd6;color:#fff;border:0;padding:10px 14px;border-radius:12px;cursor:pointer;font-size:14px;margin-top:8px}
.small{font-size:13px;color:#7b8499;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span>📚 Année scolaire</span></div>
<div class="card hero"><div class="d" id="date">...</div><div class="p" id="pct">...</div><div class="small">de l'année écoulée</div><div class="bar"><i id="barYear" style="width:0%"></i></div></div>
<div class="grid"><div class="tile"><b id="dayNum">--</b><span id="dayTxt"></span></div><div class="tile"><b id="remain" style="color:#0ca678">--</b><span>restants</span></div></div>
<div class="card"><h3>📊 En bref</h3><div class="small" id="stats"></div></div>
<div class="card"><h3>⚙️ Région</h3><select id="system"><option value="fwb">FWB – 24 août 2026 → 2 juil 2027</option><option value="france">France – 1 sept 2026 → 4 juil 2027</option></select></div>
<div class="small" style="text-align:center" id="debug"></div>
</div>
<script>
try {
  var start = new Date(2026,7,24);
  var end = new Date(2027,6,2);
  var now = new Date();
  var total = Math.round((end-start)/86400000)+1;
  var done = Math.floor((now-start)/86400000)+1;
  if(done<0) done=0; if(done>total) done=total;
  var pct = (now-start)/(end-start)*100;
  if(pct<0) pct=0; if(pct>100) pct=100;
  document.getElementById('date').textContent = now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('pct').textContent = pct.toFixed(1).replace('.',',')+' %';
  document.getElementById('barYear').style.width = pct+'%';
  document.getElementById('dayNum').textContent = done;
  document.getElementById('dayTxt').textContent = '/ '+total+' jours';
  document.getElementById('remain').textContent = total-done;
  document.getElementById('stats').textContent = 'Semaine '+Math.ceil(done/7)+' · '+Math.round((total-done)*5/7)+' jours d\'école restants';
  document.getElementById('system').addEventListener('change', function(e){
    if(e.target.value==='france'){ start=new Date(2026,8,1); end=new Date(2027,6,4); }
    else { start=new Date(2026,7,24); end=new Date(2027,6,2); }
    location.reload();
  });
} catch(err) {
  document.getElementById('debug').textContent = 'Erreur: '+err.message;
  localStorage.clear();
}
</script>
</body>
</html>
