<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Année scolaire - Progress</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;background:#f1f3f6;color:#1a2333;display:flex;justify-content:center;padding:24px 16px;min-height:100vh}
.container{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.card{background:white;border-radius:24px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.date{text-align:center;font-size:18px;margin-bottom:8px;text-transform:capitalize}
.pct{text-align:center;font-size:68px;font-weight:800;color:#5b5bd6;line-height:1;margin:8px 0}
.sub{text-align:center;font-size:17px;margin-bottom:20px}
.bar-bg{background:#eef1f6;height:16px;border-radius:999px;overflow:hidden}
.bar{background:#6c6cf5;height:100%;border-radius:999px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini{background:white;border-radius:20px;padding:20px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.mini b{font-size:34px;display:block}
.mini.green b{color:#0ca678}
.mini span{font-size:14px;color:#555}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.row strong{font-size:17px;text-transform:capitalize}
.row .p{color:#5b5bd6;font-weight:700}
.small{color:#8a94a6;font-size:14px;margin-top:8px}
h3{font-size:18px;margin-bottom:12px}
label{font-size:14px;color:#555;display:block;margin:10px 0 4px}
select,input[type=date],input[type=text]{width:100%;padding:10px 12px;border:1px solid #dde2ea;border-radius:12px;font-size:15px}
button{background:#5b5bd6;color:white;border:none;padding:10px 16px;border-radius:12px;font-size:15px;cursor:pointer;margin-top:10px}
button.ghost{background:#eef1f6;color:#333}
.event{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:15px}
.event small{color:#8a94a6}
.del{background:#ffe3e3;color:#c92a2a;padding:6px 10px;border-radius:8px;margin:0}
.flex{display:flex;gap:8px}
.flex input{flex:1}
.countdown{font-weight:700;color:#5b5bd6}
</style>
</head>
<body>
<div class="container">

<div class="card">
<div class="date" id="date">...</div>
<div class="pct" id="pct">-- %</div>
<div class="sub" id="subTitle">de l'année scolaire est écoulée</div>
<div class="bar-bg"><div class="bar" id="barYear"></div></div>
</div>

<div class="grid">
<div class="mini"><b id="dayNum">--</b><span id="dayTxt">jour sur --</span></div>
<div class="mini green"><b id="remain">--</b><span>jours restants</span></div>
<div class="mini"><b id="week">--</b><span>semaine d'école</span></div>
<div class="mini"><b id="trim">--</b><span id="trimSub">trimestre auto</span></div>
</div>

<div class="card">
<div class="row"><strong id="monthTitle">Mois</strong><span class="p" id="monthPct">-- %</span></div>
<div class="bar-bg"><div class="bar" id="barMonth" style="opacity:.7"></div></div>
<div class="small" id="monthDay">--</div>
</div>

<div class="card" id="eventsCard">
<h3>🎉 Fêtes & événements</h3>
<div id="eventsList"></div>
<div class="flex" style="margin-top:12px">
<input type="text" id="evName" placeholder="Nom : ex Noël, Examen maths...">
<input type="date" id="evDate">
</div>
<button onclick="addEvent()">+ Ajouter</button>
</div>

<div class="card">
<h3>⚙️ Système d'éducation</h3>
<label>Choisis ta région</label>
<select id="system" onchange="changeSystem(this.value)">
<option value="fwb">Belgique - FWB (24 août 2026 → 2 juil 2027)</option>
<option value="flandre">Belgique - Flandre (1 sept 2026 → 30 juin 2027)</option>
<option value="france">France (1 sept 2026 → 4 juil 2027)</option>
<option value="quebec">Québec (27 août 2026 → 23 juin 2027)</option>
<option value="suisse">Suisse Romande (17 août 2026 → 2 juil 2027)</option>
<option value="custom">Personnalisé...</option>
</select>
<div id="customDates" style="display:none">
<div class="flex">
<div style="flex:1"><label>Début</label><input type="date" id="cStart"></div>
<div style="flex:1"><label>Fin</label><input type="date" id="cEnd"></div>
</div>
<label>Nom de l'année</label>
<input type="text" id="cName" placeholder="ex : 2026-2027">
<button onclick="saveCustom()">Enregistrer mes dates</button>
</div>
<div style="margin-top:12px">
<button class="ghost" onclick="resetAll()">Réinitialiser tout</button>
</div>
</div>

<div class="card" style="text-align:center;color:#6b7280;font-size:14px" id="footerInfo"></div>

</div>

<script>
const SYSTEMS = {
  fwb:{name:"2026-2027", start:"2026-08-24", end:"2027-07-02", label:"Année scolaire FWB : du 24 août 2026 au 2 juillet 2027"},
  flandre:{name:"2026-2027", start:"2026-09-01", end:"2027-06-30", label:"Année scolaire Flandre : du 1 sept 2026 au 30 juin 2027"},
  france:{name:"2026-2027", start:"2026-09-01", end:"2027-07-04", label:"Année scolaire France : du 1 sept 2026 au 4 juil 2027"},
  quebec:{name:"2026-2027", start:"2026-08-27", end:"2027-06-23", label:"Année scolaire Québec : du 27 août 2026 au 23 juin 2027"},
  suisse:{name:"2026-2027", start:"2026-08-17", end:"2027-07-02", label:"Année scolaire Suisse : du 17 août 2026 au 2 juil 2027"},
};
let cfg = JSON.parse(localStorage.getItem('scol_cfg')||'null') || {sys:'fwb'};
let myEvents = JSON.parse(localStorage.getItem('scol_events')||'[]');

if(!myEvents.length){
  myEvents = [
    {name:"Toussaint", date:"2026-10-31"},
    {name:"Noël", date:"2026-12-25"},
    {name:"Pâques", date:"2027-04-05"},
  ];
}

function getDates(){
  if(cfg.sys==='custom') return {start:new Date(cfg.cStart+"T00:00:00"), end:new Date(cfg.cEnd+"T23:59:59"), label:`Période perso : du ${cfg.cStart} au ${cfg.cEnd}`};
  const s = SYSTEMS[cfg.sys];
  return {start:new Date(s.start+"T00:00:00"), end:new Date(s.end+"T23:59:59"), label:s.label};
}

function getTrimestre(now, start){
  const m = now.getMonth();
  // Auto simple : Sep-Nov = T1, Dec-Mar = T2, Avr-Juil = T3
  if(m>=8 && m<=10) return "T1";
  if(m==11 || m<=2) return "T2";
  return "T3";
}

function update(){
  const {start,end,label} = getDates();
  const now = new Date();
  const totalMs = end-start;
  const pct = Math.min(Math.max((now-start)/totalMs,0),1)*100;
  const totalDays = Math.round((end-start)/86400000)+1;
  let dayNum = Math.floor((now-start)/86400000)+1;
  dayNum = Math.min(Math.max(dayNum,0),totalDays);

  document.getElementById('date').textContent = now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('pct').textContent = pct.toFixed(2).replace('.',',')+' %';
  document.getElementById('barYear').style.width = pct+'%';
  document.getElementById('dayNum').textContent = dayNum;
  document.getElementById('dayTxt').textContent = `jour sur ${totalDays}`;
  document.getElementById('remain').textContent = totalDays-dayNum;
  document.getElementById('week').textContent = 'S'+Math.max(1,Math.ceil(dayNum/7));
  document.getElementById('trim').textContent = getTrimestre(now,start);
  document.getElementById('subTitle').textContent = `de l'année scolaire ${SYSTEMS[cfg.sys]?.name||cfg.cName||''} est écoulée`;

  const dim = new Date(now.getFullYear(), now.getMonth()+1,0).getDate();
  const mpct = now.getDate()/dim*100;
  document.getElementById('monthTitle').textContent = 'Mois de '+now.toLocaleDateString('fr-FR',{month:'long'});
  document.getElementById('monthPct').textContent = mpct.toFixed(1).replace('.',',')+' %';
  document.getElementById('barMonth').style.width = mpct+'%';
  document.getElementById('monthDay').textContent = `Jour ${now.getDate()} sur ${dim}`;
  document.getElementById('footerInfo').innerHTML = label+` <b>(${totalDays} jours)</b>`;

  renderEvents(now);
}

function renderEvents(now){
  const list = document.getElementById('eventsList');
  list.innerHTML='';
  myEvents.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach((e,i)=>{
    const d = new Date(e.date+"T00:00:00");
    const diff = Math.ceil((d-now)/86400000);
    let txt = diff>0 ? `dans ${diff} j` : diff===0 ? "aujourd'hui ! 🎉" : `il y a ${-diff} j`;
    const div=document.createElement('div'); div.className='event';
    div.innerHTML=`<div><b>${e.name}</b><br><small>${d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</small></div><div><span class="countdown">${txt}</span> <button class="del" onclick="delEvent(${i})">×</button></div>`;
    list.appendChild(div);
  });
  localStorage.setItem('scol_events', JSON.stringify(myEvents));
}

function addEvent(){
  const n=document.getElementById('evName').value.trim();
  const d=document.getElementById('evDate').value;
  if(!n||!d) return alert('Mets un nom et une date');
  myEvents.push({name:n,date:d});
  document.getElementById('evName').value='';
  update();
}
function delEvent(i){ myEvents.splice(i,1); update(); }

function changeSystem(v){
  cfg.sys=v;
  document.getElementById('customDates').style.display = v==='custom'?'block':'none';
  localStorage.setItem('scol_cfg', JSON.stringify(cfg));
  update();
}
function saveCustom(){
  cfg.cStart=document.getElementById('cStart').value;
  cfg.cEnd=document.getElementById('cEnd').value;
  cfg.cName=document.getElementById('cName').value||'perso';
  if(!cfg.cStart||!cfg.cEnd) return alert('Choisis début et fin');
  localStorage.setItem('scol_cfg', JSON.stringify(cfg));
  update();
}
function resetAll(){
  localStorage.removeItem('scol_cfg'); localStorage.removeItem('scol_events');
  location.reload();
}

// init select
document.getElementById('system').value=cfg.sys||'fwb';
if(cfg.sys==='custom') document.getElementById('customDates').style.display='block';

update();
setInterval(update, 30000);
</script>
</body>
</html>
